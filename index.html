<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Соображарий</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Контейнер-лента */
        .swiper-container {
            display: flex;
            width: 300%; 
            height: 100%;
            transition: transform 0.3s ease-out;
        }

        /* Страницы игры */
        .page {
            width: 33.3333%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            position: relative;
        }

        /* Удерживаем формат 9:16 на любых экранах */
        .page img, .page video {
            height: 100%;
            aspect-ratio: 9/16;
            object-fit: cover;
            display: block;
        }

        /* МИГАЮЩАЯ ПЛАШКА "ЛИСТАЙ ВЛЕВО" */
        .hint-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            pointer-events: none; /* Чтобы не мешала тапам */
            z-index: 5;
            
            /* Мягкая пульсация */
            animation: pulseBlink 2s infinite ease-in-out;
        }

        @keyframes pulseBlink {
            0% { opacity: 0.3; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(0.95); }
        }

        /* СТАТИЧНАЯ КНОПКА НА ВИДЕО */
        .play-pause-badge {
            position: absolute;
            bottom: 30px;
            right: 20px;
            background: rgba(255, 215, 0, 0.9); /* Золотисто-жёлтая */
            color: #000000;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="swiper-container" id="swiper">
        <div class="page" id="page1">
            <div class="hint-badge">Листай влево ➔</div>
            <img src="https://files.catbox.moe/7km2sn.jpeg" alt="Обложка">
        </div>

        <div class="page" id="page2">
            <div class="hint-badge">Листай влево ➔</div>
            <img src="https://files.catbox.moe/usz2s1.jpeg" alt="Правила">
        </div>

        <div class="page" id="page3">
            <div class="play-pause-badge">🔘 Старт / Стоп</div>
            <video id="gameVideo" loop playsinline preload="auto">
                <source src="https://files.catbox.moe/hhikc3.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <script>
        // Инициализируем Telegram WebApp
        const tg = window.Telegram.WebApp;

        // ПРОВЕРКА БЕЗОПАСНОСТИ: Если открыто не в Телеграме (initData пустая), блокируем страницу
        if (!tg || !tg.initData || tg.initData === "") {
            document.body.innerHTML = `
                <div style="
                    display: flex; 
                    flex-direction: column; 
                    align-items: center; 
                    justify-content: center; 
                    height: 100vh; 
                    background-color: #000000; 
                    color: #ffffff; 
                    font-family: 'Segoe UI', Roboto, sans-serif; 
                    text-align: center; 
                    padding: 30px;
                    box-sizing: border-box;
                ">
                    <h2 style="color: #ffd700; font-size: 26px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;">🤖 Доступ ограничен</h2>
                    <p style="font-size: 16px; line-height: 1.6; max-width: 360px; margin-bottom: 35px; color: #a4b0be;">
                        Интерактивная игра «Соображарий» защищена от копирования и доступна только через наш официальный Telegram-бот.
                    </p>
                    <a href="https://t.me/SoobrazhariyGameBot" style="
                        display: inline-block; 
                        padding: 16px 32px; 
                        background: linear-gradient(135deg, #ffd700, #ffa500); 
                        color: #000000; 
                        text-decoration: none; 
                        font-size: 16px; 
                        font-weight: bold; 
                        border-radius: 30px;
                        text-transform: uppercase;
                        box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
                        letter-spacing: 0.5px;
                    ">Перейти в игру</a>
                </div>
            `;
            // Останавливаем выполнение дальнейшего скрипта игры
            throw new Error("Доступ заблокирован фейсконтролем.");
        }

        // Если проверку прошли, разворачиваем WebApp на весь экран для красоты
        if (typeof tg.expand === 'function') {
            tg.expand();
        }

        // ОСНОВНАЯ ЛОГИКА ТВОЕЙ ИГРЫ
        const swiper = document.getElementById('swiper');
        const video = document.getElementById('gameVideo');
        let currentPage = 0;

        // Логика переключения экранов
        function changePage(pageIndex) {
            currentPage = pageIndex;
            swiper.style.transform = `translateX(-${currentPage * 33.3333}%)`;
            
            if (currentPage === 2) {
                video.play().catch(() => {});
            } else {
                video.pause();
            }
        }

        // Управление кликами мышкой (для компьютера)
        document.getElementById('page1').addEventListener('click', () => changePage(1));
        document.getElementById('page2').addEventListener('click', () => changePage(2));

        // Управление свайпами (для смартфонов)
        let startX = 0;
        document.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        });

        document.addEventListener('touchend', (e) => {
            let diffX = startX - e.changedTouches[0].clientX;
            if (diffX > 60 && currentPage < 2) changePage(currentPage + 1);
            if (diffX < -60 && currentPage > 0) changePage(currentPage - 1);
        });

        // Управление стрелочками и пробелом с клавиатуры
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                if (currentPage < 2) changePage(currentPage + 1);
            }
            if (e.key === 'ArrowLeft') {
                if (currentPage > 0) changePage(currentPage - 1);
            }
        });

        // Старт/Пауза видео от тапа в любом месте третьего экрана
        video.addEventListener('click', (e) => {
            e.stopPropagation();
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        });
    </script>

</body>
</html>
